{% load static %}

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">

    <div class="container">

        <!-- Logo -->
        <a class="navbar-brand fw-bold fs-3 logo" href="{% url 'home' %}">
            <span class="logo-red">Virarkar</span>
            <span class="logo-black">Fashion</span>
        </a>

        <!-- Mobile Toggle -->
        <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <!-- Navbar -->
        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto align-items-lg-center">

                <!-- Home -->
                <li class="nav-item">
                    <a class="nav-link fw-semibold" href="{% url 'home' %}">
                        Home
                    </a>
                </li>

                <!-- Shop -->
                <li class="nav-item">
                    <a class="nav-link fw-semibold" href="{% url 'product_list' %}">
                        Shop
                    </a>
                </li>

                <!-- Collections -->
                <li class="nav-item">
                    <a class="nav-link fw-semibold" href="#">
                        Collections
                    </a>
                </li>

                <!-- Contact -->
                <li class="nav-item">
                    <a class="nav-link fw-semibold" href="#">
                        Contact
                    </a>
                </li>

            </ul>

            <!-- Search Form -->
            <form class="d-flex mx-lg-4 my-3 my-lg-0"
                  method="GET"
                  action="{% url 'product_list' %}">

                <input
                    class="form-control me-2"
                    type="search"
                    name="q"
                    placeholder="Search products..."
                    value="{{ request.GET.q }}">

                <button class="btn btn-dark" type="submit">
                    <i class="bi bi-search"></i>
                </button>

            </form>

            <ul class="navbar-nav align-items-lg-center">

                <!-- Cart -->
                <li class="nav-item">
                    <a class="nav-link position-relative"
                       href="{% url 'view_cart' %}">

                        <i class="bi bi-cart3 fs-4"></i>

                        {% if request.session.cart %}
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                            {{ request.session.cart|length }}
                        </span>
                        {% endif %}

                    </a>
                </li>

                {% if user.is_authenticated %}

                <li class="nav-item">
                    <a class="nav-link fw-semibold"
                       href="{% url 'my_orders' %}">
                        My Orders
                    </a>
                </li>

                <li class="nav-item ms-lg-2">
                    <a href="{% url 'logout' %}"
                       class="btn btn-outline-dark">
                        Logout
                    </a>
                </li>

                {% else %}

                <li class="nav-item ms-lg-2">
                    <a href="{% url 'login' %}"
                       class="btn btn-dark">
                        Login
                    </a>
                </li>

                <li class="nav-item ms-lg-2">
                    <a href="{% url 'register' %}"
                       class="btn btn-danger">
                        Register
                    </a>
                </li>

                {% endif %}

            </ul>

        </div>

    </div>

</nav>
